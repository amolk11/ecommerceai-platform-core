[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerceai-platform-core"
version = "0.2.0"
description = "CommerceAI Platform Core"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Amol Kadam" }
]

dependencies = [
    "sqlalchemy>=2.0.0,<3.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.1,<3.0",
    "python-dotenv>=1.2.2,<2.0"
]

[tool.setuptools]
packages = ["platform_core"]
